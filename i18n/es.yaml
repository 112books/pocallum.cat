# Bloc autor a les notícies
author_bio_label:   "Sobre el autor"
author_bio_name:    "Joan Linux Martínez"
author_bio_role:    "Fotógrafo"
author_bio_text:    "Fotógrafo de música en directo y artes escénicas en Barcelona desde 2002. Ha documentado cientos de conciertos, estrenos de teatro y festivales culturales en Cataluña. Publica fotolibros y trabaja habitualmente con el Festival de Blues de Barcelona, Jazz I Am, Nou Barris Meets New Orleans y muchos otros."

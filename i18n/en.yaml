author_bio_text:    "Live music and performing arts photographer based in Barcelona since 2002. He has documented hundreds of concerts, theatre premieres and cultural festivals across Catalonia. He publishes photobooks and works regularly with the Festival de Blues de Barcelona, Jazz I Am, Nou Barris Meets New Orleans and many others."

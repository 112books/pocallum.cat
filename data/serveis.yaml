    items:
      - "[Directe i concerts](/serveis/concerts/) — el que passa entre dues notes"
      - "[Sessió de banda o artista](/serveis/sessio-banda/) (portada, premsa, xarxes)"
      - "[Book actoral](/serveis/books-per-actors/) — càstings i agències"
      - "[Book artístic](/serveis/books-artistics/) — premsa, xarxes i portades"
      - "[Portada de disc](/serveis/portada-disc/) — fotografia i/o disseny gràfic"
    items_en:

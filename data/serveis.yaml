grups:

  - nom:    "Cultura"
    nom_en: "Culture"
    desc:    "L'ambient d'un concert de jazz a les 2 de la matinada. La tensió abans de sortir a escena. La dansa en moviment. Fotografiem el que passa quan la cultura respira."
    desc_en: "The atmosphere of a jazz concert at 2am. The tension before going on stage. Dance in motion. We photograph what happens when culture breathes."
    items:
      - nom:    "Concerts i events musicals"
        nom_en: "Concerts and music events"
        desc:    "Fotografia documental d'esdeveniments musicals: jazz, blues, música clàssica, rock, folk i tot el que soni bé. Capturem l'energia de l'escenari i l'ambient de la sala."
        desc_en: "Documentary photography of music events: jazz, blues, classical, rock, folk and anything that sounds good. We capture the energy on stage and the atmosphere of the venue."
      - nom:    "Grups musicals i artistes"
        nom_en: "Bands and musicians"
        desc:    "Sessions fotogràfiques per a grups i artistes musicals: fotos per a premsa, xarxes socials, portades de discos i material de promoció. Al teu espai o al nostre."
        desc_en: "Photo sessions for bands and musical artists: press photos, social media, album covers and promo material. At your space or ours."
      - nom:    "Arts escèniques"
        nom_en: "Performing arts"
        desc:    "Teatre, dansa, circ, performance. Fotografiem assajos i funcions. Entenem la dinàmica de l'escena i sabem quan disparar sense molestar la feina de l'artista."
        desc_en: "Theatre, dance, circus, performance. We photograph rehearsals and shows. We understand stage dynamics and know when to shoot without disturbing the artist."

  - nom:    "Artistes"
    nom_en: "Artists"
    desc:    "Fotografies que mostren qui ets de veritat. Per a la teva carrera professional, per al teu dossier, per a la teva presència digital."
    desc_en: "Photos that show who you really are. For your professional career, your dossier, your digital presence."
    items:
      - nom:    "Book actoral"
        nom_en: "Actor portfolio"
        desc:    "Book fotogràfic professional per a actors i actrius. Sèries en estudi i en localització. Atenem les necessitats específiques de l'àmbit teatral i audiovisual."
        desc_en: "Professional photo book for actors and actresses. Studio and location series. We cater to the specific needs of the theatrical and audiovisual world."
      - nom:    "Book artístic"
        nom_en: "Artist portfolio"
        desc:    "Sessió fotogràfica per a artistes de qualsevol disciplina: músics, balladores, il·lustradors, performers. Un book que parla de la teva obra i la teva identitat."
        desc_en: "Photo session for artists of any discipline: musicians, dancers, illustrators, performers. A book that speaks of your work and your identity."
      - nom:    "Foto de perfil professional"
        nom_en: "Professional headshot"
        desc:    "Una sola fotografia que representi qui ets i el que fas. Per a la teva web, LinkedIn, premsa o qualsevol ús professional. Natural, directa, sense efectes."
        desc_en: "A single photograph that represents who you are and what you do. For your website, LinkedIn, press or any professional use. Natural, direct, no effects."

  - nom:    "Empreses"
    nom_en: "Companies"
    desc:    "La fotografia com a eina de comunicació per a empreses, organitzacions i entitats culturals. Imatges que expliquen el que feu i com ho feu."
    desc_en: "Photography as a communication tool for companies, organisations and cultural entities. Images that explain what you do and how you do it."
    items:
      - nom:    "Equip i instal·lacions"
        nom_en: "Team and premises"
        desc:    "Fotografies corporatives de l'equip humà i dels espais de treball. Per a la vostra web, memòria anual o material de presentació."
        desc_en: "Corporate photography of your team and work spaces. For your website, annual report or presentation materials."
      - nom:    "Fotografies per a xarxes socials"
        nom_en: "Social media photography"
        desc:    "Sessions periòdiques de contingut fotogràfic per a Instagram, LinkedIn i altres plataformes. Imatges coherents amb la vostra identitat visual."
        desc_en: "Periodic photo content sessions for Instagram, LinkedIn and other platforms. Images consistent with your visual identity."

grups:

  - nom:    "L'Instant"
    nom_en: "The Moment"
    image:   "/images/services/instant.jpg"
    desc:    "Fotoreportatge en directe. La reactivitat, l'adrenalina, el moment que no torna. Analògic preferent, digital quan cal. Sempre amb la mateixa mirada."
    desc_en: "Live photojournalism. Reactivity, adrenaline, the moment that won't come back. Analogue preferred, digital when needed. Always with the same eye."
    items:
      - nom:    "Concerts i actuacions en viu"
        nom_en: "Concerts and live performances"
        desc:    "Jazz, blues, flamenc, punk, folk, clàssica — qualsevol cosa que soni de debò i en directe. Capturem l'energia de l'escenari i l'ambient de la sala: el que passa a l'escena i el que passa entre el públic."
        desc_en: "Jazz, blues, flamenco, punk, folk, classical — anything that sounds real and live. We capture the energy on stage and the atmosphere of the venue: what happens on stage and what happens in the audience."
      - nom:    "Festivals"
        nom_en: "Festivals"
        desc:    "Hem treballat a festivals íntims de vint persones i a events de milers. Entenem la dinàmica d'un festival: l'estructura, els imprevistos, els moments que no surten al programa."
        desc_en: "We've worked at intimate festivals of twenty people and events of thousands. We understand the dynamics of a festival: the structure, the surprises, the moments that don't appear in the programme."
      - nom:    "Esdeveniments culturals"
        nom_en: "Cultural events"
        desc:    "Vernissages, presentacions, recitals poètics, lectures, performances puntuals. La cultura passa contínuament i molts cops ningú la documenta. Nosaltres sí."
        desc_en: "Vernissages, presentations, poetry recitals, readings, one-off performances. Culture happens constantly and often nobody documents it. We do."

  - nom:    "La Producció"
    nom_en: "The Production"
    image:   "/images/services/produccio.jpg"
    desc:    "Aquí l'instant es para. S'estudia la llum, es construeix el marc, es pensa abans de disparar. Per a músics, companyies i creadors que necessiten imatges que durin."
    desc_en: "Here the moment stops. We study the light, build the frame, think before shooting. For musicians, companies and creators who need images that last."
    items:
      - nom:    "Imatge de bandes i artistes musicals"
        nom_en: "Band and artist photography"
        desc:    "Portades de disc, material de premsa, contingut per a xarxes, making-of de gravació d'àlbums. Sessions pensades per a l'ús específic que necessites, no per a l'estoc."
        desc_en: "Album covers, press material, social media content, album recording behind-the-scenes. Sessions designed for the specific use you need, not for stock."
      - nom:    "Arts escèniques"
        nom_en: "Performing arts"
        desc:    "Dansa, teatre, circ, performance. Press kits amb cara i ulls, books de companyia, imatge per a programadors, agents i festivals. Fotografiem assajos i funcions. Sabem quan disparar sense molestar."
        desc_en: "Dance, theatre, circus, performance. Proper press kits, company books, images for programmers, agents and festivals. We photograph rehearsals and shows. We know when to shoot without disturbing."
      - nom:    "Arts visuals i encàrrecs editorials"
        nom_en: "Visual arts and editorial commissions"
        desc:    "Documentació d'obra per a pintors, escultors i videoartistes. Portades de llibres. Encàrrecs editorials específics. Qualsevol cosa que requereixi parar el temps i pensar."
        desc_en: "Documentation of work for painters, sculptors and video artists. Book covers. Specific editorial commissions. Anything that requires stopping time and thinking."

  - nom:    "El Paper"
    nom_en: "The Paper"
    image:   "/images/services/peper.png"
    desc:    "Sinergia amb 112books.eu, editorial independent de fotobooks. Del concert al llibre. Del disc a l'objecte. De la gira al record tangible."
    desc_en: "In synergy with 112books.eu, an independent photobook publisher. From concert to book. From record to object. From tour to tangible memory."
    items:
      - nom:    "Fotobooks individuals i de projecte"
        nom_en: "Individual and project photobooks"
        desc:    "Des de la idea fins al producte final. Acompanyament en totes les etapes: conceptualització, edició d'imatges, disseny, impressió, distribució."
        desc_en: "From idea to final product. Support at every stage: concept, image editing, design, printing, distribution."
      - nom:    "Edicions limitades col·leccionables"
        nom_en: "Limited collector's editions"
        desc:    "Tirades curtes, materials seleccionats, objectes que val la pena tenir. El col·leccionista de vinil i el de fotografia analògica són la mateixa persona."
        desc_en: "Short runs, selected materials, objects worth owning. The vinyl collector and the analogue photography collector are the same person."

  - nom:    "La Persona"
    nom_en: "The Person"
    image:   "/images/services/persona.jpg"
    desc:    "La imatge que et deixa ser qui ets. No la que hauries de semblar."
    desc_en: "The image that lets you be who you are. Not the one you're supposed to look like."
    items:
      - nom:    "Book actoral"
        nom_en: "Actor portfolio"
        desc:    "Per a actors i actrius que necessiten material per a càsting directors, agents i programadors. Sèries en estudi i en localització. Entenem les necessitats específiques del circuit teatral i audiovisual."
        desc_en: "For actors and actresses who need material for casting directors, agents and programmers. Studio and location series. We understand the specific needs of the theatrical and audiovisual circuit."
      - nom:    "Book artístic"
        nom_en: "Artist portfolio"
        desc:    "Per a músics, ballarins, performers, il·lustradors i creadors de qualsevol disciplina. Un book que parla de la teva obra i la teva identitat, no d'un arquetip de com ha de semblar un artista."
        desc_en: "For musicians, dancers, performers, illustrators and creators of any discipline. A book that speaks of your work and your identity, not an archetype of how an artist should look."
      - nom:    "Perfil professional"
        nom_en: "Professional headshot"
        desc:    "Una fotografia que representi qui ets i el que fas. Per a la teva web, LinkedIn, premsa o qualsevol ús professional. Natural, directa. Sense efectes ni fons de cortina."
        desc_en: "A photograph that represents who you are and what you do. For your website, LinkedIn, press or any professional use. Natural, direct. No effects, no curtain backgrounds."

  - nom:    "L'Empresa Cultural"
    nom_en: "The Cultural Organisation"
    image:   "/images/services/empresa.jpg"
    desc:    "Per a empreses i organitzacions que entenen la cultura. Imatges que expliquen el que feu i com ho feu, sense somriures forçats ni retòrica corporativa."
    desc_en: "For companies and organisations that understand culture. Images that explain what you do and how you do it, without forced smiles or corporate rhetoric."
    items:
      - nom:    "Equip i instal·lacions"
        nom_en: "Team and premises"
        desc:    "Fotografies de l'equip humà i dels espais de treball. Per a la vostra web, memòria anual o material de presentació. No fons neutres de plató si el vostre lloc de treball és interessant."
        desc_en: "Photography of your team and workspaces. For your website, annual report or presentation materials. No neutral studio backgrounds if your workplace is interesting."
      - nom:    "Contingut per a xarxes socials"
        nom_en: "Social media content"
        desc:    "Sessions periòdiques de contingut fotogràfic per a Instagram, LinkedIn i altres plataformes. Imatges coherents amb la vostra identitat visual. Presència digital que respira."
        desc_en: "Periodic photography sessions for Instagram, LinkedIn and other platforms. Images consistent with your visual identity. A digital presence that breathes."

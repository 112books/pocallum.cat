    cta: "Pressupost a mida · Parlem"
    cta_en: "Custom quote · Let's talk"

  - titol: "Per a festivals i sales"
    titol_en: "For festivals and venues"
    image: "/images/galeria/MG_9379.jpg"
    image_fit: "adapt"
    desc: "Portem quinze anys al fossat, a la platea i als camerinos. Sabem el que passa quan s'apaguen els llums."
    desc_en: "Fifteen years in the pit, the stalls and the dressing rooms. We know what happens when the lights go down."
    items:
      - "[Cobertura completa d'event](/serveis/festivals-i-sales/)"
      - "Arxiu visual reutilitzable per a comunicació i premsa"
      - "[Teatre, dansa, circ, performance](/serveis/teatre-dansa/) — sabem quan disparar sense trencar res"
    items_en:
      - "[Full event coverage](/en/serveis/festivals-and-venues/)"
      - "Reusable visual archive for communications and press"
      - "[Theatre, dance, circus, performance](/en/serveis/theatre-dance/) — we know when to shoot without breaking the spell"
    cita: "No expliquem l'escena. Hi som."
    cita_en: "We don't explain the scene. We're in it."
    cta: "Pressupost a mida · Parlem"
    cta_en: "Custom quote · Let's talk"

  - titol: "Per a projectes editorials"
    titol_en: "For editorial projects"
    images:
      - "/images/serveis/editorial.png"
      - "/images/obra/antropoformologies-i.jpg"
      - "/images/obra/ivan-kovacevic-5-spots.jpg"
      - "/images/obra/big-dani-honkin-fever.jpg"
    desc: "Del concepte a la impressió. Fotollibre, portada i identitat visual per a projectes que volen ser objectes, no només arxius."
    desc_en: "From concept to print. Photobook, cover and visual identity for projects that want to be objects, not just files."
    items:
      - "[Fotollibre](/serveis/fotollibre/) — concepte, edició, disseny, impressió (en sinergia amb 112books.eu)"
      - "[Portada i identitat visual](/serveis/portada-identitat/) (disc, llibre, cartell)"
      - "Edicions limitades col·leccionables"
    items_en:
      - "[Photobook](/en/serveis/photobook/) — concept, editing, design, printing (in synergy with 112books.eu)"
      - "[Cover and visual identity](/en/serveis/visual-identity/) (album, book, poster)"
      - "Limited collector's editions"
    cita: "Un fotollibre no és un arxiu. És una decisió editorial, un objecte amb pes i intenció."
    cita_en: "A photobook is not an archive. It's an editorial decision — an object with weight and intent."
    cta: "Pressupost a mida · Parlem"
    cta_en: "Custom quote · Let's talk"

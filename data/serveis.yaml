      - "[Band or artist session](/en/serveis/band-session/) (cover, press, social media)"
      - "[Actor portfolio](/en/serveis/books-for-actors/) — castings and agencies"
      - "[Artist portfolio](/en/serveis/artistic-portfolios/) — press, social media and covers"
      - "[Album cover](/en/serveis/album-cover/) — photography and/or graphic design"
    cita: "Treballem amb quartets que debuten i amb festivals de deu anys d'història. El criteri editorial és el mateix. El pressupost, no."

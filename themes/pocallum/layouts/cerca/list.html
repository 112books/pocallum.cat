{{ define "main" }}
<div class="cerca-page">
  <div class="section-header">
    <p class="section-eyebrow">{{ i18n "search_label" | default "Cerca al lloc" }}</p>
    <h1 class="section-title">{{ i18n "search_title" | default "Cerca" }}</h1>
  </div>

  <div class="cerca-wrap">
    <div id="js-cerca"></div>
  </div>
</div>

<link href="/pagefind/pagefind-ui.css" rel="stylesheet">
<script src="/pagefind/pagefind-ui.js"></script>
<script>
  window.addEventListener('DOMContentLoaded', () => {
    new PagefindUI({
      element: '#js-cerca',
      showSubResults: true,
      showImages: true,
      excerptLength: 25,
      translations: {
        placeholder: '{{ i18n "search_placeholder" | default "Cerca a pocallum.cat…" }}',
        zero_results: '{{ i18n "search_zero_results" | default "Cap resultat per a [SEARCH_TERM]" }}'
      }
    });

    const params = new URLSearchParams(window.location.search);
    const q = params.get('q');
    if (q) {
      const input = document.querySelector('.pagefind-ui__search-input');
      if (input) { input.value = q; input.dispatchEvent(new Event('input')); }
    }
  });
</script>
{{ end }}

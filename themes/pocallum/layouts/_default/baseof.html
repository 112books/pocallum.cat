<!DOCTYPE html>
<html lang="{{ .Language.Lang }}">
<head>
  {{ partial "head.html" . }}
</head>
<body>
  <a href="#main-content" class="skip-link">{{ i18n "skip_to_content" | default "Skip to main content" }}</a>
  {{ partial "header.html" . }}

  <main id="main-content">
    {{ block "main" . }}{{ end }}
  </main>

  {{ partial "footer.html" . }}

  <div id="js-scroll-progress" aria-hidden="true"></div>
  <button id="js-back-top" class="back-top" aria-label="Tornar al principi" hidden>
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="18 15 12 9 6 15"/></svg>
  </button>

  <div id="js-privacy-toast" class="privacy-toast" role="status" aria-live="polite" hidden>
    <span class="privacy-toast__icon" aria-hidden="true">&#x1F512;</span>
    <p class="privacy-toast__text">{{ i18n "privacy_toast" | default "Sense galetes. Sense rastre. Respectem la teva privacitat." }}</p>
  </div>

  <div id="js-lightbox" class="lightbox" hidden role="dialog" aria-modal="true" aria-label="{{ i18n "lightbox_label" | default "Imatge ampliada" }}">
    <button class="lb-close" id="js-lb-close" aria-label="{{ i18n "lightbox_close" | default "Tancar" }}">&#215;</button>
    <button class="lb-prev"  id="js-lb-prev"  aria-label="{{ i18n "lightbox_prev"  | default "Anterior" }}">&#8249;</button>
    <button class="lb-next"  id="js-lb-next"  aria-label="{{ i18n "lightbox_next"  | default "Següent" }}">&#8250;</button>
    <img id="js-lb-img" src="" alt="">
    <span class="lb-counter" id="js-lb-counter"></span>
  </div>

</body>
</html>

{{ $lp := $.Site.LanguagePrefix }}
<header class="site-header" id="js-header">
  <nav class="nav" aria-label="{{ i18n "nav_label" | default "Navegació principal" }}">

    <a href="{{ .Site.Home.RelPermalink }}" class="nav-logo" aria-label="{{ .Site.Title }}">
      <img src="{{ "images/logotip/pocallum-logo.png" | relURL }}" alt="" class="nav-logo-img" aria-hidden="true"><span class="nav-logo-name">pocallum<span class="nav-logo-dot">.</span>cat</span>
    </a>

    <button class="nav-toggle" id="js-nav-toggle" aria-expanded="false" aria-controls="js-nav-menu"
            aria-label="{{ i18n "nav_open" | default "Obre el menú" }}">
      <span></span><span></span><span></span>
    </button>

    <div class="nav-menu" id="js-nav-menu" hidden>
      <ul class="nav-links" role="list">
        {{ range .Site.Menus.main }}
        <li>
          <a href="{{ .URL | relLangURL }}"
             class="nav-link{{ if $.IsMenuCurrent "main" . }} is-active{{ end }}{{ with .Params.highlight }} nav-link--cta{{ end }}">
            {{ .Name }}
          </a>
        </li>
        {{ end }}
      </ul>

      <a href="{{ "cerca/" | relLangURL }}" class="nav-search-btn"
         aria-label="{{ i18n "search_open" | default "Cercar" }}">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round"
             aria-hidden="true" focusable="false">
          <circle cx="11" cy="11" r="8"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
      </a>

      <div class="nav-langs" aria-label="{{ i18n "lang_switcher" | default "Canvi d'idioma" }}">
        {{ range .AllTranslations }}
          {{ if not .Language.Disabled }}
          <a href="{{ .RelPermalink }}"
             class="nav-lang{{ if eq . $ }} is-active{{ end }}"
             lang="{{ .Language.Lang }}"
             hreflang="{{ .Language.Lang }}">
            {{ upper .Language.Lang }}
          </a>
          {{ end }}
        {{ end }}
      </div>
    </div>

  </nav>


</header>

{{ $imgs := split (trim .Inner "\n ") "\n" }}
<div class="article-gallery">
  {{ range $imgs }}
  {{ $url := trim . " \t\r" }}
  {{ if $url }}
  <figure class="gallery-item" data-lb-src="{{ $url | strings.TrimLeft "/" | relURL }}" data-lb-alt="">
    <img src="{{ $url | strings.TrimLeft "/" | relURL }}" loading="lazy" alt="">
  </figure>
  {{ end }}
  {{ end }}
</div>

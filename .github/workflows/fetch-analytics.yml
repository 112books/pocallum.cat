name: Fetch GoatCounter Analytics

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch analytics data
        id: fetch
        env:
          GC_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
          GC_BLOG_TOKEN: ${{ secrets.GOATCOUNTER_BLOG_TOKEN }}
          GC_ACCOUNT: "pocallum"
          GC_BLOG_ACCOUNT: "pocallum-blog"
        run: |
          END=$(date +%Y-%m-%d)
          START=$(date -d '365 days ago' +%Y-%m-%d)
          BASE="https://${GC_ACCOUNT}.goatcounter.com/api/v0"
          AUTH="Authorization: Bearer ${GC_TOKEN}"

          CHECK=$(curl -s --max-time 10 -H "${AUTH}" "${BASE}/stats/total?start=${END}&end=${END}") || true
          if ! echo "${CHECK}" | python3 -c "import sys,json; json.load(sys.stdin)" 2>/dev/null; then
            echo "::warning::Token GoatCounter invàlid o expirat — actualitza el secret GOATCOUNTER_TOKEN a GitHub → Settings → Secrets."
            echo "token_ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "token_ok=true" >> "$GITHUB_OUTPUT"

          fetch_json() {
            local url="$1"
            local auth_header="$2"
            local result
            result=$(curl -s --max-time 15 --retry 2 -H "${auth_header}" "${url}" 2>/dev/null) || true
            if echo "${result}" | python3 -c "import sys,json; json.load(sys.stdin)" 2>/dev/null; then
              echo "${result}"
            else
              echo "null"
            fi
          }

          fetch_json "${BASE}/stats/hits?start=${START}&end=${END}&limit=100"     "${AUTH}" > /tmp/hits.json
          fetch_json "${BASE}/stats/total?start=${START}&end=${END}"              "${AUTH}" > /tmp/total.json
          fetch_json "${BASE}/stats/browsers?start=${START}&end=${END}&limit=10"  "${AUTH}" > /tmp/browsers.json
          fetch_json "${BASE}/stats/systems?start=${START}&end=${END}&limit=10"   "${AUTH}" > /tmp/systems.json
          fetch_json "${BASE}/stats/sizes?start=${START}&end=${END}&limit=10"     "${AUTH}" > /tmp/sizes.json
          fetch_json "${BASE}/stats/locations?start=${START}&end=${END}&limit=15" "${AUTH}" > /tmp/locations.json
          fetch_json "${BASE}/stats/toprefs?start=${START}&end=${END}&limit=10"   "${AUTH}" > /tmp/refs.json

          # Blog GoatCounter (pocallum-blog.goatcounter.com)
          if [ -n "${GC_BLOG_TOKEN}" ]; then
            BLOG_BASE="https://${GC_BLOG_ACCOUNT}.goatcounter.com/api/v0"
            BLOG_AUTH="Authorization: Bearer ${GC_BLOG_TOKEN}"
            fetch_json "${BLOG_BASE}/stats/hits?start=${START}&end=${END}&limit=50" "${BLOG_AUTH}" > /tmp/blog_hits.json
          else
            echo "null" > /tmp/blog_hits.json
          fi

          python3 scripts/build-analytics-json.py "${START}" "${END}"

      - name: Process analytics
        if: steps.fetch.outputs.token_ok == 'true'
        run: |
          python3 scripts/process-analytics.py \
            /tmp/raw_all.json \
            static/admin/analytics.json \
            "$(date -d '365 days ago' +%Y-%m-%d)" \
            "$(date +%Y-%m-%d)"

      - name: Commit analytics
        if: steps.fetch.outputs.token_ok == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add static/admin/analytics.json
          git diff --staged --quiet || git commit -m "chore: update analytics [skip ci]"
          git pull --rebase
          git push

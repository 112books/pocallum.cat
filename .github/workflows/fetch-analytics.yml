name: Fetch GoatCounter Analytics

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    # Evita que una execució endarrerida xoqui amb la de la hora següent
    # (dues feines fent commit i push a main alhora).
    concurrency:
      group: fetch-analytics
      cancel-in-progress: false
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch analytics data
        id: fetch
        env:
          GC_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
          GC_BLOG_TOKEN: ${{ secrets.GOATCOUNTER_BLOG_TOKEN }}
          GC_ACCOUNT: "pocallum"
          GC_BLOG_ACCOUNT: "pocallum-blog"
        run: |
          END=$(date +%Y-%m-%d)
          START=$(date -d '365 days ago' +%Y-%m-%d)
          BASE="https://${GC_ACCOUNT}.goatcounter.com/api/v0"
          AUTH="Authorization: Bearer ${GC_TOKEN}"

          # Comprovació del token amb reintents. Un timeout, un 429 o un 5xx de
          # GoatCounter torna una pàgina HTML d'error; abans això es confonia amb
          # un 401 i el job fallava dient "token invàlid" tot i que el token era
          # bo (passava ~1 cop al dia amb la resta d'execucions correctes).
          probe_code() {
            local code
            code=$(curl -s -o /tmp/probe_body -w '%{http_code}' --max-time 20 \
                        -H "${AUTH}" "${BASE}/stats/total?start=${END}&end=${END}" 2>/dev/null) || true
            echo "${code:-000}"
          }

          TOKEN_OK=false
          CODE="000"
          for attempt in 1 2 3 4; do
            CODE=$(probe_code)
            if [ "${CODE}" = "200" ] && python3 -c "import json;json.load(open('/tmp/probe_body'))" 2>/dev/null; then
              TOKEN_OK=true
              break
            fi
            case "${CODE}" in
              401|403)
                echo "::error::GoatCounter ha rebutjat el token (HTTP ${CODE}). El secret GOATCOUNTER_TOKEN és invàlid, ha expirat o no té permís de lectura — regenera'l a pocallum.goatcounter.com → API i actualitza'l a GitHub → Settings → Secrets."
                echo "token_ok=false" >> "$GITHUB_OUTPUT"
                exit 1
                ;;
            esac
            echo "::warning::GoatCounter no ha respost correctament (HTTP ${CODE}, intent ${attempt}/4)"
            sleep $(( attempt * 5 ))
          done

          if [ "${TOKEN_OK}" != "true" ]; then
            echo "::error::GoatCounter no ha respost després de 4 intents (últim HTTP ${CODE}). Sembla una caiguda o un bloqueig temporal de l'API, no un problema del token: no cal tocar cap secret. Es tornarà a provar a la propera hora."
            echo "token_ok=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "token_ok=true" >> "$GITHUB_OUTPUT"

          # Descarrega un endpoint i torna JSON, o "null" si no hi ha manera.
          # Els avisos van a stderr per no embrutar el JSON que es redirigeix.
          fetch_json() {
            local url="$1"
            local auth_header="$2"
            local attempt code
            for attempt in 1 2 3; do
              code=$(curl -s -o /tmp/fetch_body -w '%{http_code}' --max-time 25 \
                          -H "${auth_header}" "${url}" 2>/dev/null) || true
              if [ "${code}" = "200" ] && python3 -c "import json;json.load(open('/tmp/fetch_body'))" 2>/dev/null; then
                cat /tmp/fetch_body
                return 0
              fi
              sleep $(( attempt * 3 ))
            done
            echo "::warning::No s'ha pogut descarregar ${url} (HTTP ${code:-000})" >&2
            echo "null"
          }

          fetch_json "${BASE}/stats/hits?start=${START}&end=${END}&limit=100"     "${AUTH}" > /tmp/hits.json
          fetch_json "${BASE}/stats/total?start=${START}&end=${END}"              "${AUTH}" > /tmp/total.json
          fetch_json "${BASE}/stats/browsers?start=${START}&end=${END}&limit=10"  "${AUTH}" > /tmp/browsers.json
          fetch_json "${BASE}/stats/systems?start=${START}&end=${END}&limit=10"   "${AUTH}" > /tmp/systems.json
          fetch_json "${BASE}/stats/sizes?start=${START}&end=${END}&limit=10"     "${AUTH}" > /tmp/sizes.json
          fetch_json "${BASE}/stats/locations?start=${START}&end=${END}&limit=15" "${AUTH}" > /tmp/locations.json
          fetch_json "${BASE}/stats/toprefs?start=${START}&end=${END}&limit=10"   "${AUTH}" > /tmp/refs.json

          # Blog GoatCounter (pocallum-blog.goatcounter.com)
          if [ -n "${GC_BLOG_TOKEN}" ]; then
            BLOG_BASE="https://${GC_BLOG_ACCOUNT}.goatcounter.com/api/v0"
            BLOG_AUTH="Authorization: Bearer ${GC_BLOG_TOKEN}"
            fetch_json "${BLOG_BASE}/stats/hits?start=${START}&end=${END}&limit=50" "${BLOG_AUTH}" > /tmp/blog_hits.json
          else
            echo "null" > /tmp/blog_hits.json
          fi

          # Si fallen les dades essencials no publiquem res: un analytics.json
          # amb zeros buidaria el dashboard i a sobre es desplegaria a producció.
          for essential in hits total; do
            if [ ! -s "/tmp/${essential}.json" ] || [ "$(cat /tmp/${essential}.json)" = "null" ]; then
              echo "::error::No s'han pogut descarregar les dades essencials de GoatCounter (/tmp/${essential}.json). No es publica analytics.json aquesta hora."
              exit 1
            fi
          done

          python3 scripts/build-analytics-json.py "${START}" "${END}"

      - name: Process analytics
        if: steps.fetch.outputs.token_ok == 'true'
        run: |
          python3 scripts/process-analytics.py \
            /tmp/raw_all.json \
            static/stats/analytics.json \
            "$(date -d '365 days ago' +%Y-%m-%d)" \
            "$(date +%Y-%m-%d)"

      - name: Commit analytics
        id: commit
        if: steps.fetch.outputs.token_ok == 'true'
        run: |
          # Xarxa de seguretat: un analytics.json a zero sobre un que tenia
          # visites és una caiguda de GoatCounter, no un web sense públic.
          NEW_TOTAL=$(python3 -c "import json;print(json.load(open('static/stats/analytics.json')).get('total',0))" 2>/dev/null || echo 0)
          OLD_TOTAL=$(git show HEAD:static/stats/analytics.json 2>/dev/null | python3 -c "import sys,json;print(json.load(sys.stdin).get('total',0))" 2>/dev/null || echo 0)
          if [ "${NEW_TOTAL:-0}" = "0" ] && [ "${OLD_TOTAL:-0}" != "0" ]; then
            echo "::error::Les dades noves són a zero però les publicades tenien ${OLD_TOTAL} visites — no es fa commit ni desplegament."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add static/stats/analytics.json
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: update analytics"
            git pull --rebase
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger production deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Un push fet amb GITHUB_TOKEN no dispara altres workflows (protecció
          # anti-bucle de GitHub), per això calem deploy-prod.yml explícitament.
          gh workflow run deploy-prod.yml --ref main

name: Deploy → Staging (Dinahosting)

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "dinahosting-staging"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Hugo
        run: |
          wget -q https://github.com/gohugoio/hugo/releases/download/v0.159.0/hugo_extended_0.159.0_linux-amd64.tar.gz
          tar -xzf hugo_extended_0.159.0_linux-amd64.tar.gz
          sudo mv hugo /usr/local/bin/

      - name: Build Hugo (staging, amb drafts)
        run: |
          hugo --minify \
               --baseURL "https://staging.pocallum.cat/" \
               --buildDrafts

      - name: Deploy a Dinahosting via rsync
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY_DINAHOSTING }}
          REMOTE_HOST: ${{ secrets.DINAHOSTING_HOST }}
          REMOTE_USER: ${{ secrets.DINAHOSTING_USER }}
          REMOTE_PATH: ${{ secrets.DINAHOSTING_PATH_STAGING }}   # ~/www/staging
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$REMOTE_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          # Rsync: substitueix tot el contingut excepte .well-known/.
          rsync -rlzv --delete \
            --exclude='.well-known/' \
            --no-perms \
            public/ \
            "${REMOTE_USER}@${REMOTE_HOST}:${REMOTE_PATH}/"
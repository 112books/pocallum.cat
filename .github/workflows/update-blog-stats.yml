name: Update Blog Stats

on:
  schedule:
    - cron: '0 6 * * 1'  # dilluns a les 6h UTC
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch and update blog stats
        run: python scripts/update-blog-stats.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/ca/blog/_index.md content/en/blog/_index.md
          git diff --staged --quiet || git commit -m "chore: update blog stats [skip ci]"
          git pull --rebase
          git push

baseURL = "https://pocallum.cat/"
title   = "Pocallum"
theme   = "pocallum"
enableRobotsTXT = true
enableGitInfo   = false
disableHugoGeneratorInject = true
summaryLength   = 70
buildFuture     = true

defaultContentLanguage        = "ca"
defaultContentLanguageInSubdir = false

[sitemap]
  filename = "sitemap.xml"

[pagination]
  pagerSize = 6

[outputs]
  home    = ["HTML", "RSS"]
  section = ["HTML", "RSS"]

# ── Idiomes ──────────────────────────────────────────────────────────────────

[languages]

  [languages.ca]
    contentDir = "content/ca"
    label      = "Català"
    locale     = "ca"
    weight     = 1
    title      = "Pocallum"
    [languages.ca.params]
      description = "Fotografia de cultura. Jazz, blues, teatre, dansa i arts escèniques. Barcelona."
      ogLocale    = "ca_ES"

  [languages.en]
    contentDir = "content/en"
    label      = "English"
    locale     = "en"
    weight     = 2
    title      = "Pocallum"
    [languages.en.params]
      description = "Cultural photography. Jazz, blues, theatre, dance and performing arts. Barcelona."
      ogLocale    = "en_GB"

  [languages.es]
    contentDir = "content/es"
    label      = "Castellano"
    locale     = "es"
    weight     = 3
    disabled   = true
    title      = "Pocallum"
    [languages.es.params]
      description = "Fotografía cultural. Jazz, blues, teatro, danza y artes escénicas. Barcelona."
      ogLocale    = "es_ES"

# ── Paràmetres globals ────────────────────────────────────────────────────────

[params]
  author          = "Joan Linux Martínez"
  contactEmail    = "hola@pocallum.cat"
  contactPhone    = "+34 687 836 757"
  location        = "Nau Bostik, Barcelona"
  instagram       = "https://www.instagram.com/pocallum"
  facebook        = "https://www.facebook.com/pocallum"
  blog            = "https://blog.pocallum.cat"
  about           = "https://about.pocallum.cat"
  goatcounterSite = "pocallum"
  # tallyFormContact = ""  # no utilitzat — substituït pel wizard natiu
  formspreeContact  = "https://formspree.io/f/xnjgrpnn"
  defaultOgImage    = "/images/logotip/pocallum-logo.png"

[taxonomies]
  equip = "equip"
  tag   = "tags"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    style  = "monokai"
    lineNos = false

[minify]
  disableCSS  = false
  disableHTML = false
  disableJS   = false


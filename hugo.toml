baseURL = "https://pocallum.cat/"
title   = "Pocallum"
theme   = "pocallum"
enableRobotsTXT = true
enableGitInfo   = false
summaryLength   = 70
buildFuture     = true

defaultContentLanguage        = "ca"
defaultContentLanguageInSubdir = false

[pagination]
  pagerSize = 6

[outputs]
  home    = ["HTML", "RSS"]
  section = ["HTML", "RSS"]

# ── Idiomes ──────────────────────────────────────────────────────────────────

[languages]

  [languages.ca]
    contentDir   = "content/ca"
    languageName = "Català"
    languageCode = "ca"
    weight       = 1
    title        = "Pocallum"
    [languages.ca.params]
      description = "Fotografia de cultura. Jazz, blues, teatre, dansa i arts escèniques. Barcelona."
      locale      = "ca_ES"

  [languages.en]
    contentDir   = "content/en"
    languageName = "English"
    languageCode = "en"
    weight       = 2
    title        = "Pocallum"
    [languages.en.params]
      description = "Cultural photography. Jazz, blues, theatre, dance and performing arts. Barcelona."
      locale      = "en_GB"

  [languages.es]
    contentDir   = "content/es"
    languageName = "Castellano"
    languageCode = "es"
    weight       = 3
    disabled     = true
    title        = "Pocallum"
    [languages.es.params]
      description = "Fotografía cultural. Jazz, blues, teatro, danza y artes escénicas. Barcelona."
      locale      = "es_ES"

# ── Paràmetres globals ────────────────────────────────────────────────────────

[params]
  author          = "Joan Linux Martínez"
  contactEmail    = "hola@pocallum.cat"
  contactPhone    = "+34 687 836 757"
  location        = "Nau Bostik, Barcelona"
  instagram       = "https://www.instagram.com/pocallum"
  facebook        = "https://www.facebook.com/pocallum"
  flickr          = "https://www.flickr.com/photos/pocallum"
  blog            = "https://blog.pocallum.cat"
  about           = "https://about.pocallum.cat"
  goatcounterSite = "pocallum"
  tallyFormContact  = ""   # ID del formulari Tally (no utilitzat, substituït pel wizard natiu)
  formspreeContact  = ""   # Endpoint Formspree, ex: "https://formspree.io/f/xnjgrpnn"

[taxonomies]
  equip = "equip"
  tag   = "tags"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    style  = "monokai"
    lineNos = false

[minify]
  disableCSS  = false
  disableHTML = false
  disableJS   = false

